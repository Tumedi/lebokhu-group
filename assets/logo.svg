<svg width="360" height="80" viewBox="0 0 360 80" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="LeKhuBo Connect logo">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6C453"/>
      <stop offset="55%" stop-color="#E4A020"/>
      <stop offset="100%" stop-color="#B87910"/>
    </linearGradient>
    <linearGradient id="teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1FA98A"/>
      <stop offset="100%" stop-color="#0C6B57"/>
    </linearGradient>
    <linearGradient id="ink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#173A5E"/>
      <stop offset="100%" stop-color="#0B2038"/>
    </linearGradient>
  </defs>

  <!-- Emblem: interlocking link + radiating industry nodes -->
  <g transform="translate(6,6)">
    <circle cx="34" cy="34" r="33" fill="none" stroke="url(#ink)" stroke-width="3"/>
    <g fill="url(#gold)">
      <circle cx="34" cy="4"  r="3"/>
      <circle cx="59" cy="16" r="3"/>
      <circle cx="64" cy="45" r="3"/>
      <circle cx="45" cy="63" r="3"/>
      <circle cx="20" cy="63" r="3"/>
      <circle cx="4"  cy="45" r="3"/>
      <circle cx="9"  cy="16" r="3"/>
    </g>
    <path d="M37 20 a15 15 0 1 0 0 28 a9 9 0 1 1 0 -28 Z" fill="url(#teal)"/>
    <path d="M31 48 a15 15 0 1 0 0 -28 a9 9 0 1 1 0 28 Z" fill="url(#gold)"/>
    <circle cx="34" cy="34" r="4.5" fill="url(#ink)"/>
  </g>

  <!-- Wordmark -->
  <g font-family="Georgia, 'Times New Roman', serif">
    <text x="82" y="42" font-size="30" font-weight="700" fill="url(#ink)">Le<tspan fill="url(#gold)">Khu</tspan><tspan fill="url(#teal)">Bo</tspan></text>
    <text x="83" y="62" font-size="12" font-family="Arial, Helvetica, sans-serif" font-weight="600" fill="#5a6b7b" letter-spacing="2">CONNECT</text>
  </g>
</svg>
