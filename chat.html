<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat — LeKhuBo Connect</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <meta name="theme-color" content="#0B2038">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header class="site-header" id="top">
    <div class="container nav-inner">
      <a href="index.html" class="brand" aria-label="LeKhuBo Connect home">
        <img src="assets/logo.svg" alt="LeKhuBo Connect" class="logo logo-dark">
      </a>
      <nav class="main-nav" id="mainNav" aria-label="Main navigation">
        <a href="services-directory.html">Find a Service</a>
        <a href="index.html">Home</a>
      </nav>
      <button class="nav-toggle" id="navToggle" aria-label="Toggle menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <section class="page-hero">
    <div class="hero-bg" aria-hidden="true"></div>
    <div class="container">
      <p class="eyebrow">Your Conversation</p>
      <h1>Chat</h1>
      <p class="lead" id="chatSub">Message your service provider directly.</p>
    </div>
  </section>

  <section class="section">
    <div class="container narrow">
      <div class="notice" id="chatError" hidden>
        This conversation link is invalid or has expired. Please use the link from your service request.
      </div>
      <div class="reg-form" id="chatCard" hidden>
        <div class="chat-provider" id="chatProvider"></div>
        <div id="chatMount"></div>
      </div>
    </div>
  </section>

  <footer class="site-footer">
    <div class="footer-bottom">
      <div class="container"><p>&copy; <span id="year"></span> LeKhuBo Connect. All rights reserved. &middot; <a href="admin.html">Admin</a></p></div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/main.js"></script>
  <script src="js/chat-page.js"></script>
</body>
</html>
