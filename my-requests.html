<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Requests — LeKhuBo Connect</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <meta name="theme-color" content="#0B2038">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="admin-body">

  <header class="admin-header">
    <div class="container nav-inner">
      <a href="index.html" class="brand"><img src="assets/logo.svg" alt="LeKhuBo Connect" class="logo"></a>
      <nav class="main-nav" id="mainNav" aria-label="Account navigation">
        <a href="services-directory.html" class="nav-cta">＋ Request a Service</a>
        <span class="admin-user" id="who"></span>
        <a href="#" id="logoutBtn">Log Out</a>
      </nav>
    </div>
  </header>

  <main class="dashboard">
    <div class="container">
      <div class="dash-head">
        <div>
          <p class="kicker">Homeowner</p>
          <h1>My Requests</h1>
        </div>
        <div class="dash-actions">
          <a href="services-directory.html" class="btn btn-primary btn-sm">＋ Request a service</a>
        </div>
      </div>

      <div class="notice" id="notConfigured" hidden>
        ⚠️ Accounts aren't available yet — the database connection isn't configured.
      </div>

      <div class="stat-cards" id="statCards"></div>
      <p class="results-count" id="count">Loading…</p>

      <div class="table-wrap">
        <table class="data-table" id="table">
          <thead>
            <tr>
              <th>Date</th><th>Provider</th><th>Service</th><th>Details</th><th>Status</th><th>Chat</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
        <div class="no-results" id="noRows" hidden>
          <p>You haven't requested any services yet. <a href="services-directory.html">Find a service</a> to get started!</p>
        </div>
      </div>
    </div>
  </main>

  <!-- ===== CHAT MODAL ===== -->
  <div class="modal" id="chatModal" hidden>
    <div class="modal-backdrop" data-cclose></div>
    <div class="modal-card match-card" role="dialog" aria-modal="true" aria-labelledby="chatTitle">
      <button class="modal-close" data-cclose aria-label="Close">&times;</button>
      <h3 id="chatTitle">Chat</h3>
      <p class="modal-role" id="chatWith"></p>
      <div id="chatMount"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/my-requests.js"></script>
</body>
</html>
